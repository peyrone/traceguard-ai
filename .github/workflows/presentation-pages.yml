name: Publish pitch to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'presentation/**'
      - '.github/workflows/presentation-pages.yml'
  workflow_dispatch:
concurrency:
  group: presentation-pages
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: presentation
      - name: Publish
        id: deploy
        uses: actions/deploy-pages@v4
