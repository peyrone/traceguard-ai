openapi: 3.0.3
info:
  title: TraceGuard API
  version: 0.1.0
paths:
  /healthz:
    get:
      operationId: Healthz
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /api/v1/scenarios:
    get:
      operationId: ListScenarios
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Scenario'
  /api/v1/analyze:
    post:
      operationId: Analyze
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyzeResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Scenario not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Analysis failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalyzeRequest'
  /api/v1/report-summary:
    post:
      operationId: CreateReportSummary
      description: Generate a localized edition from the server-owned scenario and policy.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportSummaryRequest'
      responses:
        '200':
          description: Validated summary or deterministic fallback
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportSummary'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Unknown scenario
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Could not analyze the scenario
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/explain:
    post:
      operationId: Explain
      description: Explain a selected finding using redacted audit evidence.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExplainRequest'
      responses:
        '200':
          description: Explanation and validated evidence references
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExplainResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: The server could not load or analyze scenario evidence for the explanation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/privacy/decisions:
    post:
      operationId: CreatePrivacyDecision
      description: Evaluate a trusted demo policy and run only the synthetic transfer executor when the decision is ALLOW. No customer data is transferred. The result is separate from historical audit evidence.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrivacyDecisionRequest'
      responses:
        '200':
          description: Decision and synthetic execution result. Missing decision attributes or an unavailable policy yield INDETERMINATE.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivacyDecisionResponse'
        '400':
          description: Malformed or incorrectly typed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Unknown scenario or candidate outside the selected scenario
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    ReportAudience:
      type: string
      enum: [executive, engineering]
    ReportLanguage:
      type: string
      enum: [en, th]
    ReportSummaryRequest:
      type: object
      additionalProperties: false
      required: [scenario_id, audience, language]
      properties:
        scenario_id: {type: string, minLength: 1}
        audience: {$ref: '#/components/schemas/ReportAudience'}
        language: {$ref: '#/components/schemas/ReportLanguage'}
    ReportSummary:
      type: object
      required: [scenario_id, audience, language, status, mode, sections]
      properties:
        scenario_id: {type: string}
        audience: {$ref: '#/components/schemas/ReportAudience'}
        language: {$ref: '#/components/schemas/ReportLanguage'}
        status: {$ref: '#/components/schemas/Status'}
        mode: {type: string, enum: [ai, fallback]}
        sections:
          type: array
          items:
            $ref: '#/components/schemas/ReportSection'
    ReportSection:
      type: object
      required: [kind, text, evidence_event_ids]
      properties:
        kind: {type: string, enum: [conclusion, uncertainty, route, action]}
        text: {type: string}
        evidence_event_ids: {type: array, items: {type: string}}
        rule_id: {type: string}
    PrivacyDecisionRequest:
      type: object
      description: Send scenario_id and candidate_id together for a server-resolved fixture transfer. Otherwise use the legacy explicit attributes. Missing attributes in the applicable evidence can return INDETERMINATE.
      properties:
        scenario_id:
          type: string
        candidate_id:
          type: string
        source_service:
          type: string
        destination_service:
          type: string
        data_categories:
          type: array
          items:
            type: string
        purpose:
          type: string
        policy_id:
          type: string
    PrivacyDecisionResponse:
      type: object
      required: [decision, rule_id, reason, transfer_executed]
      properties:
        decision:
          type: string
          enum: [ALLOW, DENY, INDETERMINATE]
        rule_id:
          type: string
        reason:
          type: string
        transfer_executed:
          type: boolean
          description: True only when the synthetic executor produced a receipt. Always false for DENY or INDETERMINATE.
    Health:
      type: object
      properties:
        status: &id001
          type: string
      required:
      - status
    Error:
      type: object
      properties:
        code: *id001
        message: *id001
      required:
      - code
      - message
    Scenario:
      type: object
      properties:
        id: *id001
        label: *id001
      required:
      - id
      - label
    Event:
      type: object
      properties:
        event_id: *id001
        trace_id: *id001
        transfer_id: *id001
        service: *id001
        action: *id001
        source_service: *id001
        destination_service: *id001
        data_ref: *id001
        classification: *id001
        purpose: *id001
        occurred_at: &id002
          type: string
          format: date-time
        observed_at: *id002
        outcome:
          type: string
          enum:
          - COMPLETED
          - ATTEMPTED
          - FAILED
      required:
      - event_id
      - service
      - action
      - occurred_at
      - observed_at
      - outcome
    Policy:
      type: object
      properties:
        policy_id: *id001
        classification: *id001
        allowed_destinations:
          type: array
          items: *id001
        allowed_purposes:
          type: array
          items: *id001
      required:
      - policy_id
      - classification
      - allowed_destinations
      - allowed_purposes
    AnalyzeRequest:
      description: Use scenario_id alone or a non-null events array with policy. An
        empty events array is accepted with scenario_id for compatibility with the
        blueprint example. A supplied policy overrides the scenario policy.
      properties:
        scenario_id: *id001
        events:
          type: array
          items:
            $ref: '#/components/schemas/Event'
        policy:
          $ref: '#/components/schemas/Policy'
      type: object
    Status:
      type: string
      enum:
      - VERIFIED_VIOLATION
      - POTENTIAL_VIOLATION
      - INCONCLUSIVE
      - NO_VIOLATION_OBSERVED
    Summary:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/Status'
        events_processed:
          type: integer
      required:
      - status
      - events_processed
    Node:
      type: object
      properties:
        id: *id001
        label: *id001
        kind: *id001
      required:
      - id
      - label
      - kind
    Edge:
      type: object
      properties:
        id: *id001
        source: *id001
        target: *id001
        evidence_status:
          type: string
          enum:
          - OBSERVED
          - INFERRED
        evidence_event_ids:
          type: array
          items: *id001
      required:
      - id
      - source
      - target
      - evidence_status
      - evidence_event_ids
    Graph:
      type: object
      properties:
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/Node'
        edges:
          type: array
          items:
            $ref: '#/components/schemas/Edge'
      required:
      - nodes
      - edges
    Finding:
      type: object
      properties:
        id: *id001
        rule_id: *id001
        status:
          $ref: '#/components/schemas/Status'
        message: *id001
        evidence_event_ids:
          type: array
          items: *id001
        missing_evidence:
          type: array
          items: *id001
      required:
      - id
      - rule_id
      - status
      - message
      - evidence_event_ids
      - missing_evidence
    TransferCandidate:
      type: object
      description: Redacted evidence for one historical transfer or inferred relationship. Only the server can resolve a candidate into a simulated request.
      required: [id, edge_id, source_service, destination_service, evidence_status, evidence_event_ids, policy_id]
      properties:
        id: *id001
        edge_id: *id001
        source_service: *id001
        destination_service: *id001
        evidence_status:
          type: string
          enum: [OBSERVED, INFERRED]
        evidence_event_ids:
          type: array
          items: *id001
        classification:
          type: string
          description: Omitted when the selected evidence does not establish the transfer classification.
        purpose:
          type: string
          description: Omitted when the selected evidence does not establish the transfer purpose.
        policy_id: *id001
    AnalyzeResponse:
      type: object
      properties:
        summary:
          $ref: '#/components/schemas/Summary'
        graph:
          $ref: '#/components/schemas/Graph'
        transfer_candidates:
          type: array
          description: Scenario-scoped redacted candidates for fixture-backed analysis with the server-owned policy. Omitted for custom events or policy overrides.
          items:
            $ref: '#/components/schemas/TransferCandidate'
        findings:
          type: array
          items:
            $ref: '#/components/schemas/Finding'
      required:
      - summary
      - graph
      - findings
    ExplainRequest:
      type: object
      required: [finding, rule_summary, evidence]
      properties:
        finding:
          $ref: '#/components/schemas/Finding'
        rule_summary:
          type: string
          description: Redacted summary of the applicable policy rule.
        evidence:
          type: array
          items:
            $ref: '#/components/schemas/ExplainEvidence'
    ExplainEvidence:
      type: object
      required: [event_id]
      properties:
        event_id:
          type: string
          description: Opaque audit event identifier.
        action:
          type: string
        outcome:
          type: string
    ExplainResponse:
      type: object
      required: [explanation, next_steps, evidence_event_ids, mode]
      properties:
        explanation:
          type: string
        next_steps:
          type: array
          items:
            type: string
        evidence_event_ids:
          type: array
          items:
            type: string
        mode:
          type: string
          enum: [ai, fallback]
        insights:
          type: array
          items:
            $ref: '#/components/schemas/InvestigationInsight'
        gdpr_mappings:
          type: array
          items:
            $ref: '#/components/schemas/GDPRMapping'
    InvestigationInsight:
      type: object
      required: [kind, text, evidence_event_ids]
      properties:
        kind:
          type: string
          enum: [observation, policy_concern, uncertainty]
        text: *id001
        evidence_event_ids:
          type: array
          items: *id001
    GDPRReference:
      type: object
      required: [article, title, criteria, source_url, guidance_url]
      properties:
        article:
          type: string
          description: Article number with paragraph and point where applicable.
        title: *id001
        criteria: *id001
        source_url: *id001
        guidance_url: *id001
    GDPRMapping:
      type: object
      required: [reference, assessment, rationale, evidence_event_ids, missing_facts]
      properties:
        reference:
          $ref: '#/components/schemas/GDPRReference'
        assessment:
          type: string
          enum: [potential_concern, insufficient_information]
        rationale: *id001
        evidence_event_ids:
          type: array
          items: *id001
        missing_facts:
          type: array
          items: *id001
